name: Verify environment secrets

# Manual diagnostic workflow — confirms each of the 8 GitHub Environments
# (dev/test/preprod/prod + probation-*) actually has working KUBE_CERT,
# KUBE_CLUSTER, KUBE_NAMESPACE, KUBE_TOKEN secrets, by authenticating to
# the real Cloud Platform cluster and checking pod access. This goes
# further than just checking secret names exist (Settings > Environments
# only shows names, never values, and a stale/rotated token would still
# "exist"). Safe to run standalone: it never touches Docker/GHCR, never
# runs helm, and never prints secret values (GitHub auto-redacts them in
# logs, and this workflow itself never echoes them raw).
#
# Run manually: Actions -> Verify environment secrets -> Run workflow.
# A failed job pinpoints exactly which environment's Cloud Platform
# Terraform wiring is missing or broken.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - test
          - preprod
          - prod
          - probation-dev
          - probation-test
          - probation-preprod
          - probation-prod
    name: Verify ${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Check required secrets are set
        env:
          KUBE_CERT: ${{ secrets.KUBE_CERT }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          for name in KUBE_CERT KUBE_CLUSTER KUBE_NAMESPACE KUBE_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or missing for ${{ matrix.environment }}"
              exit 1
            fi
          done

      - name: Authenticate to Cloud Platform
        run: |
          echo "${{ secrets.KUBE_CERT }}" > /tmp/ca.crt
          kubectl config set-cluster "${{ secrets.KUBE_CLUSTER }}" \
            --certificate-authority=/tmp/ca.crt \
            --server="https://${{ secrets.KUBE_CLUSTER }}"
          kubectl config set-credentials deploy-user \
            --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context deploy \
            --cluster="${{ secrets.KUBE_CLUSTER }}" \
            --user=deploy-user \
            --namespace="${{ secrets.KUBE_NAMESPACE }}"
          kubectl config use-context deploy

      - name: Prove the token actually authenticates
        run: |
          kubectl auth can-i get pods -n "${{ secrets.KUBE_NAMESPACE }}"
          kubectl get pods -n "${{ secrets.KUBE_NAMESPACE }}" --request-timeout=10s
