name: Pipeline

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/frontend_java_pipeline.yml@v1
    secrets: inherit
    with:
      deploy-ref: refs/heads/main
      java-version: '21'
      gradle-check-command: 'check'
      cache-key-file: 'build.gradle.kts'
      test-results-path: 'build/test-results'
      reports-path: 'build/reports/tests'
      dockerfile-dir: '.'
      docker-registry: 'ghcr.io'
      registry-org: 'ministryofjustice'

      track1-chart-name: ''
      track1-release-name: ''

      enable-track2: true
      track2-chart-name: 'hmpps-probation-mi-api'
      track2-release-name: 'hmpps-probation-mi-api'

      # Build + deploy track1 DEV on feature/PR branches; probation + higher envs stay on main
      deploy-dev-on-feature-branches: true

      slack-channel: 'dpr_cicd_approvals'
