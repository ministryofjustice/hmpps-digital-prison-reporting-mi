# Tag reads from helm_app_release.yml on hmpps-reporting-releases.
# Includes the pull request check and a push or manual run from main.
# MoJ OIDC subjects include owner id 2203574 and releases repo id 1446045442.
issuer: https://token.actions.githubusercontent.com
subject_pattern: '^repo:ministryofjustice@2203574/hmpps-reporting-releases@1446045442:(ref:refs/heads/main|pull_request)$'
claim_pattern:
  job_workflow_ref: '^ministryofjustice/hmpps-reporting-releases/\.github/workflows/helm_app_release\.yml@refs/(heads/main|pull/[0-9]+/merge)$'
  event_name: '^(workflow_dispatch|push|pull_request)$'
permissions:
  contents: read
